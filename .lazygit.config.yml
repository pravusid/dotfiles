gui:
  sidePanelWidth: 0.25
  timeFormat: 2006-01-02 15:04 +09
  shortTimeFormat: 03:04PM
  nerdFontsVersion: 3
  filterMode: fuzzy
  enlargedSideViewLocation: top

git:
  pagers:
    - pager: delta --dark --side-by-side --paging=never
    - pager: delta --dark --paging=never

keybinding:
  commits:
    moveDownCommit: <f7>
    moveUpCommit: <f8>
